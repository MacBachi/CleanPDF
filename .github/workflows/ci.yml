name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15:       oldest supported image (Swift 6.1)
        # macos-26:       current image (newest Swift)
        # macos-15-intel: Intel hardware, so the x86_64 code path is exercised
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: End-to-end test suite
        run: ./tests/run.sh

      - name: Build app bundle
        run: ./build-app.sh
