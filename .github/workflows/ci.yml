name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15: oldest supported image (Xcode 16 / Swift 6.0–6.1)
        # macos-26: current image (latest Xcode / Swift)
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run test suite
        run: ./tests/run.sh

      - name: Build app bundle
        run: ./build-app.sh
